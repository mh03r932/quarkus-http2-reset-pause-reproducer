# HTTP/2 is on by default; this makes it explicit for the reproducer.
quarkus.http.http2=true

# only for CallSiteThreadTest: a small input buffer pushes a 4k body onto the blocking input path, and the raised
# form limits let the 1 MB multipart field through
quarkus.rest.input-buffer-size=100
quarkus.http.limits.max-form-attribute-size=10M
quarkus.http.limits.max-body-size=20M
